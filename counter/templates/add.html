<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>Add Food</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-[#071426] text-white flex items-center justify-center px-6">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">

        <!-- Page heading -->
        <h1 class="text-3xl font-bold text-[#071426] text-center">
            Add Food
        </h1>

        <p class="mt-2 text-center text-gray-500">
            Add a food item and its calorie count.
        </p>

        <!-- Food form -->
        <form method="POST" class="mt-8 space-y-5">

            <!-- Protect the form from CSRF attacks -->
            {% csrf_token %}

            <!-- Display the FoodForm fields -->
            <div class="text-[#071426] space-y-4">
                {{ form.as_p }}
            </div>

            <!-- Submit the form -->
            <button
                type="submit"
                class="w-full rounded-xl bg-[#071426] px-5 py-3 font-semibold text-white transition hover:bg-[#10233d]"
            >
                Add Food
            </button>

        </form>

        <!-- Link back to the homepage -->
        <a
            href="{% url 'home' %}"
            class="mt-5 block text-center text-sm font-semibold text-[#071426] hover:text-blue-600"
        >
            Back to Home
        </a>

    </div>

</body>

</html>
