<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>Delete Food</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-[#071426] text-white flex items-center justify-center px-6">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl">

        <!-- Page heading -->
        <h1 class="text-3xl font-bold text-[#071426]">
            Delete Food
        </h1>

        <!-- Ask the user to confirm the deletion -->
        <p class="mt-4 text-gray-600">
            Are you sure you want to delete
            <span class="font-bold text-[#071426]">{{ food.name }}</span>?
        </p>

        <!-- Delete confirmation form -->
        <form method="POST" class="mt-6">

            <!-- Protect the form from CSRF attacks -->
            {% csrf_token %}

            <!-- Submit the deletion -->
            <button
                type="submit"
                class="w-full rounded-xl bg-red-600 px-5 py-3 font-semibold text-white transition hover:bg-red-700"
            >
                Yes, Delete
            </button>

        </form>

        <!-- Allow the user to cancel -->
        <a
            href="{% url 'home' %}"
            class="mt-4 inline-block w-full rounded-xl bg-[#071426] px-5 py-3 font-semibold text-white transition hover:bg-[#10233d]"
        >
            Cancel
        </a>

    </div>

</body>

</html>
