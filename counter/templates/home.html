<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>Calorie Counter</title>

</head>

<body>

    <!-- Main page heading -->
    <h1>Calorie Counter</h1>

    <!-- Display the total calories -->
    <h2>Total Calories: {{ total_calories }}</h2>

    <!-- Button for adding a new food -->
    <a href="{% url 'add_food' %}">
        <button type="button">Add Food</button>
    </a>

    <hr>

    <!-- Food section heading -->
    <h2>Food Items</h2>

    <!-- Check if food items exist -->
    {% if foods %}

        <!-- Loop through all food items -->
        {% for food in foods %}

            <!-- Display the food name -->
            <h3>{{ food.name }}</h3>

            <!-- Display the calories -->
            <p>Calories: {{ food.calories }}</p>

            <!-- Display when the food was added -->
            <p>Added: {{ food.date_added }}</p>

            <!-- Button for deleting the food -->
            <a href="{% url 'delete_food' food.id %}">
                <button type="button">Delete</button>
            </a>

            <!-- Separate food items -->
            <hr>

        <!-- End the food loop -->
        {% endfor %}

    <!-- If there are no food items -->
    {% else %}

        <!-- Display a message -->
        <p>No food items have been added yet.</p>

    <!-- End the if statement -->
    {% endif %}

</body>

</html>
